authors:
  Egor Kotov:
    href: "https://www.ekotov.pro"
  Dmitry Boyko:
    href: "https://orcid.org/0000-0001-5640-6788"

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github, lightswitch]

home:
  title: 'rmotis: Client for Modular Open Transportation Information System'
  description: 'Automate installation of the MOTIS server and provide user friendly API for routing.'

reference:
  - title: "Routing API"
    description: "Main functions for point-to-point and one-to-many routing."
    contents:
      - motis_plan
      - motis_plan_manual
      - motis_one_to_many
      - motis_one_to_many_intermodal
      - motis_one_to_all
  - title: "Batch Routing"
    description: "Functions for efficient batch processing of routing requests."
    contents:
      - motis_one_to_many_batch
      - motis_one_to_many_generate_batch
      - motis_one_to_many_plan_batch
      - motis_one_to_many_read_batch
      - motis_plan_generate_batch
      - motis_one_to_all_generate_batch
  - title: "Server Management"
    description: "Control local MOTIS instances."
    contents:
      - motis_start_server
      - motis_stop_server
      - motis_stop_all
      - motis_servers
      - motis_set_server_address
      - motis_open_ui
  - title: "Installation & Configuration"
    description: "Manage MOTIS binaries, data, and configurations."
    contents:
      - motis_install
      - motis_uninstall
      - motis_check_available_versions
      - motis_check_latest_version
      - motis_config
      - motis_configure_import
      - motis_configure_server
      - motis_prepare_data
      - motis_import
      - motis_add_assets
      - motis_clear_path
      - motis_unlock_limits
  - title: "Diagnostics & Utilities"
    contents:
      - motis_diagnose
      - motis_gui
  - title: "Experimental Text API"
    contents:
      - motis_one_to_all_txt_1
      - motis_plan_txt_1
